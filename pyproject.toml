[tool.poetry]
name = "kr 1"
version = "0.1.0"
description = ""
authors = [ "Nasty <konstantinskorohodov84@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.34.2"
python-dotenv = "^1.2.2"
pandas = ">=2.3.0,<2.4.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = "^7.1"
black = "^26.3"
isort = "^8.0"
mypy = "^1.19"
flake8 = "^7.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = ["venv"]
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true

[tool.mypy."pytest.*"]
ignore_missing_imports = true